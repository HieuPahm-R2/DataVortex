spring:
  application:
    name: adinsight
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/adinsight?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:adinsight}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
adinsight:
  security:
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:}
      audience: ${OIDC_AUDIENCE:}
      jwk-set-uri: ${OIDC_JWK_SET_URI:}
ingestion:
  cloud:
    project: ${WAREHOUSE_PROJECT:}
    bucket: ${WAREHOUSE_BUCKET:}
    dataset: ${WAREHOUSE_DATASET:}
    location: ${WAREHOUSE_LOCATION:}
    artifacts-root: ${WAREHOUSE_ARTIFACTS_ROOT:}
    dataform-repository: ${WAREHOUSE_DATAFORM_REPOSITORY:}
    dataform-revision: ${WAREHOUSE_DATAFORM_REVISION:}
    maximum-bytes-billed: ${WAREHOUSE_MAXIMUM_BYTES_BILLED:}
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  structured:
    format:
      console: logstash
  pattern:
    correlation: "[requestId=%X{requestId:-}] "
