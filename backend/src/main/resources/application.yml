spring:
  application:
    name: adinsight
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/adinsight?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:adinsight}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  pattern:
    correlation: "[requestId=%X{requestId:-}] "
